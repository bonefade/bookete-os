<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bookete CRM</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#1C2B25; --muted:#5E6E67; --line:#D9E0DB;
  --pine:#2F5D50; --pine-soft:#E2ECE7; --due:#B5412E; --due-soft:#F7E4DF; --brass:#9A7424; --brand:#013E37;
  box-sizing:border-box;
  --topbar:60px;
  --tabbar:56px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A17; --surface:#1B2420; --ink:#E6EDE9; --muted:#9AABA3; --line:#2C3833;
    --pine:#7FB7A3; --pine-soft:#223630; --due:#EE8A76; --due-soft:#3A2520; --brass:#D6B266; --brand:#FFEEB3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131A17; --surface:#1B2420; --ink:#E6EDE9; --muted:#9AABA3; --line:#2C3833;
  --pine:#7FB7A3; --pine-soft:#223630; --due:#EE8A76; --due-soft:#3A2520; --brass:#D6B266; --brand:#FFEEB3; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--topbar) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Source Sans 3",system-ui,sans-serif;margin:0;line-height:1.15}
a{color:var(--pine)}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
button,.btn{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button.primary,.btn.primary{background:var(--pine);border-color:var(--pine);color:var(--bg);font-weight:600}
button.link{border:none;background:none;color:var(--pine);padding:10px 4px;font-weight:600}
button.danger{color:var(--due);border-color:var(--due);background:transparent}
button:disabled{opacity:.45}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:140px;resize:vertical}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:12px}
label>input,label>select,label>textarea{margin-top:4px}
.full{width:100%}
.note{color:var(--muted);font-size:.9rem;margin:4px 0 0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* headers */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 16px}
.head h1{font-size:1.9rem}
.head p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topbar));z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.bar h2{flex:1;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.bar button{min-width:84px}

/* tabs: at the bottom on a phone, a rail on the left from tablet width (at the end) */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:680px}
.tab{border:none;border-radius:0;background:none;color:var(--muted);flex-direction:column;gap:0;padding:8px 4px 6px;min-height:var(--tabbar);font-size:.8rem;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--pine);font-weight:600}
/* A shut tab takes no click, on its icon and label either, whichever element a browser hands the click to. */
.tab:disabled{pointer-events:none}
.tab .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--due);color:#fff;border-radius:999px;font-size:.7rem;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center;font-weight:600}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.5rem;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}

/* sections + rows */
.sec{margin-top:22px}
.sec>h3{font-size:1.05rem;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.sec>h3 small{font-family:"Source Sans 3",sans-serif;font-weight:400;color:var(--muted);font-size:.85rem}
ul.rows{list-style:none;margin:0;padding:0}
.row{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;min-height:60px}
.row.due{border-left:4px solid var(--due)}
.row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row .nm{font-family:"Bricolage Grotesque",sans-serif;font-size:1.08rem;font-weight:500}
.row .st{font-size:.82rem;color:var(--pine);font-weight:600;white-space:nowrap}
.row .sub{display:block;font-size:.93rem;margin-top:2px}
.row .meta{display:block;color:var(--muted);font-size:.85rem;margin-top:1px}
.row .meta.due{color:var(--due);font-weight:600}
.fit{color:var(--brass);font-size:.85rem;letter-spacing:1px}
.empty{padding:22px 12px;color:var(--muted);text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card+.card{margin-top:10px}

/* detail */
.pill{display:inline-block;background:var(--pine-soft);color:var(--pine);border-radius:999px;padding:3px 10px;font-weight:600;font-size:.9rem}
.touch{color:var(--muted);font-size:.9rem}
.furow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.furow input{flex:1 1 140px;width:auto}
.furow button{flex:0 0 auto;padding:8px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:6px 12px;border-radius:999px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--bg)}
.chip.lostc[aria-pressed="true"]{background:var(--due);border-color:var(--due)}
.facts{padding:2px 14px}
.fact{padding:9px 0;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:none}
.fact dt{font-size:.82rem;color:var(--muted)}
.fact dd{margin:0;white-space:pre-wrap;word-break:break-word}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{border:none;background:none;color:var(--pine);padding:4px 0;min-height:32px;font-weight:600}
.entry{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin-bottom:16px}
.entry.out{border-left-color:var(--pine)}
.entry.in{border-left-color:var(--brass)}
/* Each note a box of its own, so one note is told from the next at a glance. */
.entry.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px 12px}
.entry.note .t{margin-top:6px}
.nadd{display:flex;gap:10px;align-items:stretch;margin:12px 0 20px}
.nadd textarea{flex:1;min-height:52px;margin:0}
.nadd button{align-self:flex-start}
.entry.note textarea{width:100%;margin-top:8px}
.entry .h{font-size:.83rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.entry .h button{min-height:32px;padding:2px 10px;font-size:.83rem}
.entry .t{white-space:pre-wrap;word-break:break-word;margin-top:2px}
.compose textarea{min-height:200px}
.hint{font-size:.85rem;color:var(--muted);background:var(--pine-soft);border-radius:10px;padding:8px 10px;margin:8px 0}
.icp h4{margin:12px 0 4px;font-size:.95rem;color:var(--muted);font-weight:600}
.icp ul{margin:0;padding-left:20px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.optout{border-color:var(--due);background:var(--due-soft)}
.optout p:first-child{color:var(--due)}

/* ---- v4: responsive compact list, filters ---- */
.wrap.wide{max-width:1280px}
.stats{grid-template-columns:repeat(4,1fr)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
/* two selects side by side on a phone, all in one row on a wide screen */
.fbar select{flex:1 1 160px;width:auto;min-width:0;max-width:260px;min-height:40px;padding:6px 10px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.toolbar input[type=search]{flex:1 1 140px;width:auto;min-width:0}
.toolbar select{flex:0 1 190px;width:auto;min-width:0}
@media (max-width:759px){.toolbar select{flex-basis:130px}}
.count{margin:4px 2px 8px}
ul.ltable{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.ltable li+li{border-top:1px solid var(--line)}
.lrow,.lhead{display:grid;width:100%;text-align:left;align-items:center;column-gap:10px}
.lrow{border:none;border-radius:0;background:transparent;padding:9px 14px 9px 12px;min-height:48px;
  grid-template-columns:minmax(0,1fr) auto auto;
  grid-template-areas:"name fit when" "sub sub mail"}
.lrow:hover{background:var(--pine-soft)}
.lrow.due{box-shadow:inset 4px 0 0 var(--due)}
.lrow.out{opacity:.6}
.c-name{grid-area:name;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-fit{grid-area:fit;color:var(--brass);font-size:.8rem;letter-spacing:1px}
.c-when{grid-area:when;font-size:.82rem;color:var(--muted);white-space:nowrap;text-align:right}
.c-when.warn{color:var(--due);font-weight:600}
.c-mail{grid-area:mail;font-size:.85rem;color:var(--muted);text-align:right}
.c-loc,.c-st,.c-next{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-st{color:var(--pine);font-weight:600}
.st-disqualifiziert{color:var(--due)}
/* mobile: two lines — name/fit/when, then status · ort · next */
.c-sub{grid-area:sub;font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead{display:none}
@media (max-width:759px){ .lrow .c-loc,.lrow .c-st,.lrow .c-next{display:none} }
@media (min-width:760px){
  .lrow,.lhead{grid-template-columns:minmax(160px,2.2fr) 44px minmax(90px,1fr) 118px minmax(120px,2.4fr) 22px 118px;grid-template-areas:none}
  .lrow{grid-template-rows:auto}
  .lrow>span{grid-area:auto!important;padding:0!important}
  .lrow .c-sub{display:none}
  .lhead{display:grid;padding:8px 12px;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--bg)}
  .c-mail{text-align:center}
}

/* quick edit */
.sec>h3 small{margin-left:auto}
.qe-click{cursor:pointer;border-radius:8px;transition:background .15s}
.qe-click:hover,.qe-click:focus-visible{background:var(--pine-soft)}
.facts .qe-click{margin:0 -8px;padding-left:8px;padding-right:8px}
.qe-empty{color:var(--muted);font-style:italic}
.fact.editing dd{margin-top:4px}
.qe-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.qe-actions button{min-height:38px;padding:6px 14px}
@media (min-width:760px){.facts.qe{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}.facts.qe .fact{border-bottom:1px solid var(--line)}}
label[hidden]{display:none}
label.drop,label.check{display:flex;align-items:center;gap:8px;margin:0}
label.drop>input,label.check>input{width:20px;min-height:20px;flex:none;margin:0;padding:0}
.sig{white-space:pre-line}
.account h4{margin:14px 0 2px}
.account h4:first-child{margin-top:0}
/* brand: the Connected Circles mark from the bookete app (public/brand/), colors as there */
/* The top bar stays in view, so the search field does while results scroll; it holds the safe area above it. */
.brandbar{position:sticky;top:0;z-index:6;background:var(--bg);height:calc(env(safe-area-inset-top,0px) + var(--topbar));padding:env(safe-area-inset-top,0px) max(16px,calc(50% - 624px)) 0;display:flex;align-items:center;gap:12px}
.brand{display:inline-flex;align-items:center;gap:8px;color:var(--brand);flex:none}
.brand svg{height:24px;aspect-ratio:5/3}
.brand .wm{font:500 1.15rem/1 Manrope,system-ui,sans-serif;letter-spacing:-.02em}
.brand .sub{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
/* On the narrowest phones the search field needs the room of "CRM" to show its whole placeholder. */
@media (max-width:359px){.brand .sub{display:none}}

/* ---- v5: global search ---- */
:root{--mark:#F3DFA2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--mark:#5B4A1C}}
:root[data-theme="dark"]{--mark:#5B4A1C}
.sfield{position:relative;flex:1 1 auto;min-width:0;max-width:520px}
.sfield svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.sfield input{padding-left:44px;font-size:1.05rem;border-radius:14px}
.sfield input:disabled{opacity:.45}
.sfield input:focus{border-color:var(--pine);outline:none;box-shadow:0 0 0 3px var(--pine-soft)}
.srow{display:block;width:100%;text-align:left;border:none;border-radius:0;background:transparent;padding:10px 14px;min-height:52px}
.srow:hover,.srow.act{background:var(--pine-soft)}
.srow.due{box-shadow:inset 4px 0 0 var(--due)}
.srow.out{opacity:.6}
.s-top{display:flex;gap:8px;align-items:baseline}
.s-name{font-weight:600;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-st{font-size:.82rem;color:var(--pine);font-weight:600;white-space:nowrap}
.s-meta{display:block;font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-meta .warn{color:var(--due);font-weight:600}
.s-hit{font-size:.88rem;margin-top:3px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s-hit b{color:var(--muted);font-weight:600;font-size:.8rem;margin-right:4px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
kbd{font:inherit;font-size:.8rem;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--surface)}
@media (hover:none){.skeys{display:none}}
/* The search opens over the screen, between the top bar and the tabs, and leaves it as it is; the tabs stay in reach and close it.
   It ends above the tabs at the bottom (their height and border), so no result, picked by key or scrolled to, hides under them. */
.sbox{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + 1px + env(safe-area-inset-bottom,0px));top:calc(env(safe-area-inset-top,0px) + var(--topbar));z-index:8}
.sbox[hidden]{display:none}
/* The page's scroll padding keeps a focused field clear of the top bar. The search field sits in that bar, so the same
   padding would scroll the screen under the search: on the click into the field, which its margin cancels, and on
   every key typed, as Chrome reveals the caret by the page's padding alone, so that is off while the search shows.
   The page itself does not scroll then either, by a wheel or a swipe outside the results. */
#gq{scroll-margin-top:calc(-1 * (env(safe-area-inset-top,0px) + var(--topbar) + 64px))}
html:has(#sbox:not([hidden])){scroll-padding-top:0;overflow:hidden}
.sback{position:absolute;inset:0;width:100%;height:100%;border:none;border-radius:0;padding:0;background:rgba(0,0,0,.3);touch-action:none}
.spanel{position:relative;max-height:100%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.shead{display:flex;align-items:baseline;gap:12px}
.shead .note{flex:1 1 auto}
/* ---- v6: Heute as one queue, the lead page with one feed and one composer ---- */
.qrow{display:grid;width:100%;text-align:left;border:none;border-radius:0;background:transparent;padding:9px 14px 9px 12px;min-height:52px;column-gap:10px;row-gap:2px;align-items:center;
  grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"name ch go" "why why go"}
.qrow:hover{background:var(--pine-soft)}
.q-name{grid-area:name;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-ch{grid-area:ch;font-size:.78rem;color:var(--pine);background:var(--pine-soft);border-radius:999px;padding:1px 8px;white-space:nowrap}
.q-ch.none{color:var(--ink);background:var(--mark)}
.q-why{grid-area:why;font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-go{grid-area:go;font-size:.88rem;color:var(--pine);font-weight:600;white-space:nowrap}
@media (min-width:760px){.qrow{grid-template-columns:minmax(120px,1.3fr) auto minmax(0,3fr) auto;grid-template-areas:"name ch why go"}}
.days{list-style:none;margin:0;padding:2px 14px}
.days li{padding:8px 0;border-bottom:1px solid var(--line)}
.days li:last-child{border-bottom:none}
/* the bar of a round through a list, on the lead it opened */
.qbar{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 12px;margin-bottom:10px}
.q-pos{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem}
.qbar button{flex:none}
.chips.later{margin:-4px 0 10px}
.chips.later input{flex:1 1 140px;width:auto;min-height:36px;padding:4px 10px}
/* the status chip opens the menu of the usual next moves */
.menu{margin-top:10px;padding:4px 6px}
.mitem{display:flex;width:100%;justify-content:space-between;text-align:left;border:none;background:transparent;padding:8px}
.mitem+.mitem{border-top:1px solid var(--line);border-radius:0}
.mitem:hover{background:var(--pine-soft)}
.mitem b,.mitem small{display:block}
.mitem small{color:var(--muted);font-size:.83rem;font-weight:400}
.mitem.danger{color:var(--due)}
/* "Eintragen" opens over the buttons: above them where they sit at the bottom of a phone, below them on a laptop. */
.acts{position:relative}
.acts>.logmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:8;min-width:260px;max-width:calc(100vw - 32px);overflow:visible;white-space:normal;font-size:1rem;padding:4px 6px;margin:0;box-shadow:0 6px 24px rgba(0,0,0,.18)}
label.inline{display:flex;align-items:center;gap:8px}
label.inline input{width:auto;margin:0}
.next{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding:4px 6px 4px 12px;border-radius:10px;background:var(--pine-soft)}
.next.lacks{background:var(--mark)}
.next.due{background:var(--due-soft);color:var(--due);font-weight:600}
.next .more{flex:none}
.nedit{margin-top:10px}
.acts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:10px 0}
.acts>*{font-size:.8rem;padding:8px 0;min-width:0;overflow:hidden;white-space:nowrap}
.acts [aria-disabled="true"]{opacity:.35;pointer-events:none}
@media (max-width:359px){.acts>*{font-size:.66rem}}
/* Where the tabs sit at the bottom, the action row sits right above them; the page leaves room for it. */
@media (max-width:759px),(max-height:479px){
  .acts{position:fixed;left:0;right:0;bottom:calc(var(--tabbar) + 1px + env(safe-area-inset-bottom,0px));z-index:7;margin:0;padding:8px max(16px,calc(50% - 324px));background:var(--bg);border-top:1px solid var(--line)}
  .wrap.lead{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
  body:has(.acts) .toast{bottom:calc(136px + env(safe-area-inset-bottom,0px))}
  .acts>.logmenu{top:auto;bottom:calc(100% + 6px);right:16px}
}
/* Infos fold on a phone and stand open beside the feed on a wide screen; .desk shows only there. */
.ifold{width:100%;justify-content:space-between;text-align:left;font-weight:600}
.infos>h3{display:none}
.infos:not(.open)>dl{display:none}
.infos.open>.ifold{margin-bottom:8px}
.desk{display:none}
.infos>dl+h3+dl{margin-top:10px}
/* "Für das Gespräch" belongs to the Infos fold while it folds. */
@media not all and (min-width:1100px) and (min-height:480px){
  .l-side:has(.infos:not(.open))+.l-work .talk{display:none}
  /* A customer's onboarding comes before its Infos and Kundenakte. */
  .wrap.lead:has(.cust){display:flex;flex-direction:column}
  .wrap.lead:has(.cust)>.l-side{order:1}
  .wrap.lead:has(.cust)>.l-feed{order:2}
}
/* the sequence as a checklist: done, the answer that stopped it, still to come */
.checks{list-style:none;margin:0;padding:4px 14px}
.checks li{display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.checks li:first-child{border-top:none}
.checks li::before{content:"";grid-row:1/span 4;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box;font-size:.7rem;line-height:16px;text-align:center}
.checks li.ok::before{content:"\2713";background:var(--pine);border-color:var(--pine);color:var(--bg)}
.checks li.now{background:var(--mark);margin:0 -14px;padding:10px 14px}
.checks li.now::before{border-color:var(--brass)}
.checks b,.checks small,.checks .two{grid-column:2}
.checks small{display:block;color:var(--muted);font-size:.83rem}
.checks li.todo b{color:var(--muted);font-weight:500}
.checks .two{margin-top:8px}
.checks .two button{min-height:36px;padding:6px 10px;font-size:.88rem}
.checks small.late{color:var(--due);font-weight:600}
.checks .more{grid-column:2;justify-self:start;padding:0;min-height:0;margin-top:2px}
.checks .early{grid-column:2;display:flex;gap:16px}
.checks .early .more{grid-column:auto}
/* a customer's care: who looks after it and its phase, above the onboarding */
.cust .owner{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.cust .owner select{flex:1;width:auto}
.q-why.due{color:var(--due);font-weight:600}
/* a business's todos: a tick, the text with its day, a bin; a line to add one */
.tlist{list-style:none;margin:0 0 10px;padding:0}
.tlist li{display:grid;grid-template-columns:30px minmax(0,1fr) 36px;column-gap:6px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line)}
.tlist .tick{width:24px;height:24px;min-width:0;min-height:0;padding:0;margin-top:1px;border-radius:50%;border:2px solid var(--line);background:transparent;font-size:.75rem;line-height:1}
.tlist li.done .tick{background:var(--pine);border-color:var(--pine);color:var(--bg)}
.tlist li.done span{color:var(--muted)}
.tlist small{display:block;color:var(--muted);font-size:.83rem}
.tlist small.late{color:var(--due);font-weight:600}
.tlist .ttext{display:block;min-height:0;padding:0;border:none;background:transparent;text-align:left;font:inherit;color:inherit;cursor:text}
.tlist li.edit{display:block}
.tlist .bin{min-width:0;min-height:0;padding:0 8px;border:none;background:transparent;color:var(--muted);font-size:1.1rem}
.tadd{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tadd #tdText{flex:1 1 160px;width:auto}
.tadd #tdDue{flex:0 1 150px;width:auto}
.tadd button{min-width:44px}
.stchips{align-items:center}
.phchips{margin-top:6px;align-items:center}
.phchips .note{margin-right:2px}
.att-line{margin:0 0 8px;padding:6px 10px;border-radius:10px;background:var(--mark);font-weight:600;font-size:.9rem}
.ltable li.att{box-shadow:inset 4px 0 0 var(--brass)}
.cust .late{color:var(--due)}
.q-name small{color:var(--muted);font-weight:400}
/* the feed */
.feedc{margin-top:22px}
.chip small{color:inherit;opacity:.7;margin-left:2px}
.thread{margin-bottom:16px}
.card+.card.thread{margin-top:0}
.th-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pill.new{background:var(--mark);color:var(--ink);font-size:.8rem;white-space:nowrap}
.entry .t.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-acts{display:flex;gap:6px;flex:none}
.sline{color:var(--muted);font-size:.85rem;margin:0 0 16px;padding-left:15px}
/* the composer and the sheets */
.c-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-6px 0 8px}
.c-head b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chans{margin-bottom:10px}
select.chip{width:auto;min-height:36px;padding:6px 12px}
.optout.box{border:1px solid var(--due);border-radius:12px;padding:10px 12px;margin:8px 0}
.optout.box p:first-child{margin:0;font-weight:600}
.after{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px}
.sheet h3{margin-bottom:4px}
/* Wide: Heute's side panel beside the queue. The lead page: the name and the action row on top, then the work
   (what a talk needs, the sequence) on the left, the feed in the middle, the facts on the right. */
@media (min-width:1100px) and (min-height:480px){
  .today{display:grid;grid-template-columns:minmax(0,1fr) 340px;column-gap:28px;align-items:start}
  /* The feed's row is 1fr, so a tall side column lengthens it and leaves no gap above the feed. */
  .wrap.lead{max-width:1440px;display:grid;grid-template-columns:300px minmax(0,1fr) 300px;grid-template-rows:auto auto auto 1fr;
    grid-template-areas:"round round round" "hero hero hero" "work top side" "work feed side";column-gap:24px;align-items:start}
  .lead>.l-round{grid-area:round}
  .lead>.hero{grid-area:hero;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:start;margin-bottom:18px}
  .hero>*{grid-column:1/-1}
  .hero>.h-top{grid-column:1}
  .hero h1{font-size:1.75rem;margin-bottom:6px}
  .hero>.acts{grid-column:2;grid-row:1;display:flex;gap:8px;margin:0}
  .hero>.acts>*{padding:8px 16px;font-size:.92rem}
  .hero>.acts>[data-compose="E-Mail"]{order:-1;background:var(--pine);border-color:var(--pine);color:var(--bg);font-weight:600}
  .lbar h2{visibility:hidden}
  .lead>.l-work{grid-area:work}
  .lead>.l-side{grid-area:side}
  .lead>.l-top{grid-area:top}
  .lead>.l-feed{grid-area:feed}
  .infos>.ifold{display:none}
  .infos>h3{display:flex}
  .lead .facts.qe{display:block}
  .desk{display:block}
}
/* From tablet width the tabs are a rail on the left, under the top bar; the screens and the search move right of it.
   The rail needs the height of all the tabs, so a phone on its side, as wide as a tablet, keeps them at the bottom. */
@media (min-width:760px) and (min-height:480px){
  :root{--rail:calc(88px + env(safe-area-inset-left,0px))}
  .tabs{top:calc(env(safe-area-inset-top,0px) + var(--topbar));right:auto;width:var(--rail);border-top:none;border-right:1px solid var(--line);padding:8px 0 0 env(safe-area-inset-left,0px);align-items:flex-start}
  .tabs .in{display:flex;flex-direction:column}
  .tab{min-height:68px}
  #app{margin-left:var(--rail)}
  .sbox{left:var(--rail);bottom:0}
  .wrap{padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(24px + env(safe-area-inset-bottom,0px));left:calc(50% + var(--rail) / 2)}
}

</style>
