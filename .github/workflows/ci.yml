name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]

# Least privilege: the token can only read the repo. Jobs ask for more explicitly.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A newer push to the same branch makes this run pointless.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: crm/package-lock.json
      - run: npm ci --prefix crm
      # All four steps are blocking; .githooks/pre-commit runs the same commands.
      - name: scraper tests
        run: npm test
      - name: crm tests
        run: npm --prefix crm test
      - name: crm build
        run: npm --prefix crm run build
      - name: AGENTS.md current
        run: python3 .claude/agents_md.py . --check

  # Advisory: the migrations apply in order to an empty local D1 (wrangler's own SQLite, not the test double),
  # and a query reads the newest columns. Deploy does not wait on it; promote it to blocking once it has
  # run green on a few migrations.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    concurrency:
      group: migrations-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: crm/package-lock.json
      - run: npm ci
      - name: apply migrations locally (advisory)
        run: npx wrangler d1 migrations apply crm --local
      - name: smoke query (advisory)
        run: npx wrangler d1 execute crm --local --command "SELECT scopes, gmail_cursor FROM users LIMIT 0"

  # Deploys main to crm.bookete.com after the tests pass. Off until the repo
  # variable CRM_DEPLOY is "true" (set it once Cloudflare is set up, see crm/README.md).
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CRM_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deploys queue, never interleave, and are never cancelled mid-apply.
    concurrency:
      group: deploy-crm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci --prefix crm
      # Both steps are blocking. Dry run first: the log shows which migrations the deploy is about to
      # apply to production, and a failed API call stops the deploy before anything is applied.
      - name: pending migrations
        run: npx wrangler d1 migrations list crm --remote
        working-directory: crm
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm --prefix crm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
